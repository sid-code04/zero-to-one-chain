name: SUPPLY_CHAIN_ANALYTICS
description: Supply Chain Decision Twin analytics model for Zero to One Chain. Provides canonical metric definitions for On-Time Delivery (OTD), OTIF, Fill Rate, Days of Inventory (DOI), Landed Cost, and Supplier Risk Score. Every persona (Planning, Procurement, Logistics) gets the same answer for the same question. Data flows through a 9-layer architecture from raw ingestion to governed semantic views.
tables:
- name: VW_METRIC_INVENTORY
  base_table:
    database: ZERO_TO_ONE_CHAIN
    schema: L6_SEMANTIC
    table: VW_METRIC_INVENTORY
  dimensions:
  - name: ABC_CLASS
    expr: ABC_CLASS
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: AVAILABLE_QTY
    expr: AVAILABLE_QTY
    data_type: NUMBER(5,0)
    access_modifier: public_access
  - name: CATEGORY
    expr: CATEGORY
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: DAYS_ON_HAND
    expr: DAYS_ON_HAND
    data_type: NUMBER(3,0)
    access_modifier: public_access
  - name: FAMILY
    expr: FAMILY
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: IN_TRANSIT_QTY
    expr: IN_TRANSIT_QTY
    data_type: NUMBER(4,0)
    access_modifier: public_access
  - name: MATERIAL_NUMBER
    expr: MATERIAL_NUMBER
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: ON_HAND_QTY
    expr: ON_HAND_QTY
    data_type: NUMBER(4,0)
    access_modifier: public_access
  - name: ON_ORDER_QTY
    expr: ON_ORDER_QTY
    data_type: NUMBER(4,0)
    access_modifier: public_access
  - name: PART_NAME
    expr: PART_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: PLANT_CODE
    expr: PLANT_CODE
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: PLANT_NAME
    expr: PLANT_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: QUARANTINE_QTY
    expr: QUARANTINE_QTY
    data_type: NUMBER(3,0)
    access_modifier: public_access
  - name: REGION
    expr: REGION
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: REORDER_POINT
    expr: REORDER_POINT
    data_type: NUMBER(3,0)
    access_modifier: public_access
  - name: SAFETY_STOCK_QTY
    expr: SAFETY_STOCK_QTY
    data_type: NUMBER(4,0)
    access_modifier: public_access
  - name: STOCK_STATUS
    expr: STOCK_STATUS
    data_type: VARCHAR(12)
    access_modifier: public_access
  facts:
  - name: CARRYING_COST_USD_DAILY
    expr: CARRYING_COST_USD_DAILY
    data_type: NUMBER(10,2)
    access_modifier: public_access
  - name: DAYS_OF_INVENTORY
    expr: DAYS_OF_INVENTORY
    data_type: NUMBER(13,1)
    access_modifier: public_access
  - name: INVENTORY_VALUE_USD
    expr: INVENTORY_VALUE_USD
    data_type: NUMBER(14,2)
    access_modifier: public_access
  - name: OBSOLESCENCE_RISK_PCT
    expr: OBSOLESCENCE_RISK_PCT
    data_type: NUMBER(5,2)
    access_modifier: public_access
  - name: TURNOVER_RATIO
    expr: TURNOVER_RATIO
    data_type: NUMBER(5,2)
    access_modifier: public_access
  time_dimensions:
  - name: SNAPSHOT_DATE
    expr: SNAPSHOT_DATE
    data_type: DATE
    access_modifier: public_access
  - name: SNAPSHOT_MONTH
    expr: SNAPSHOT_MONTH
    data_type: DATE
    access_modifier: public_access
- name: VW_METRIC_LANDED_COST
  base_table:
